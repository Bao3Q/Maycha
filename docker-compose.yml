# Chạy cả 3 thành phần: PostgreSQL + Backend (NestJS) + Frontend (Next.js)
#   docker compose up --build
# Frontend: http://localhost:3000 | Backend: http://localhost:3001 | DB: localhost:5432
name: maycha

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maycha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maycha_password}
      POSTGRES_DB: ${POSTGRES_DB:-maycha_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-maycha}:${POSTGRES_PASSWORD:-maycha_password}@db:5432/${POSTGRES_DB:-maycha_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Trình duyệt gọi API qua cổng đã publish ra máy host
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
