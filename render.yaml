# Render Blueprint – deploy backend NestJS (apps/api) chạy 24/24
# Render → New → Blueprint → chọn repo này. Các biến "sync: false" sẽ được hỏi khi tạo.
services:
  - type: web
    name: maycha-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Chuỗi kết nối PostgreSQL (Neon), dạng postgresql://...?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Render tự sinh chuỗi ngẫu nhiên
      - key: JWT_SECRET
        generateValue: true
      # Địa chỉ frontend trên Cloudflare, vd https://maycha-web.<ten>.workers.dev
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_DEMO_SEED
        value: "false"
      - key: SEPAY_BANK_CODE
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_ACCOUNT_NAME
        sync: false
      - key: SEPAY_API_KEY
        sync: false
